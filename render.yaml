services:
  - type: web
    name: steuer-rag-api
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn steuer_rag.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STEUER_RAG_LLM_PROVIDER
        sync: false
      - key: STEUER_RAG_LLM_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: steuer-rag-ui
    runtime: python
    buildCommand: pip install -e .
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: STEUER_RAG_LLM_PROVIDER
        sync: false
      - key: STEUER_RAG_LLM_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
